<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Registro de Gastos</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
</head>
<body>

    <!-- Barra de Navegação -->
    <nav class="navbar">
        <!-- Botão Hambúrguer no lado direito com identificadores de animação -->
        <button id="btnMenu" class="btn-menu" aria-label="Abrir Menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" stroke-width="3" stroke-linecap="round">
                <line class="linha-topo" x1="3" y1="6" x2="21" y2="6"></line>
                <line class="linha-meio" x1="3" y1="12" x2="21" y2="12"></line>
                <line class="linha-baixo" x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        
       <!-- Menu suspenso -->
       <div id="menuDropdown" class="menu-dropdown">
            <a href="pagina2.html">Previsão de Gastos</a>
            <a href="pagina3.html">Controle</a>
            
            <!-- Separador Moderno -->
            <div class="menu-separador"></div>
            
            <a href="configuracoes.html">Configurações</a>
            <a href="#" id="btn-login-sync">Sincronizar com Google</a>
        </div>

    </nav>

    <div class="container">
        <h2>Configurações</h2>

        <div class="form-group">
            <label for="dinheiroInicial">Dinheiro Inicial (R$):</label>
            <p class="texto-dica">
                Adicione um valor base para a sua conta. Este valor será somado ao saldo total sem aparecer como um registro na tabela.
            </p>
            <input type="number" id="dinheiroInicial" step="0.01" placeholder="Ex: 200.00">
        </div>

        <!-- O ID começa com "btnRegistrar" para herdar o seu CSS já existente -->
        <button id="btnRegistrarConfig" class="btn-config">
            Salvar Configurações
        </button>
    </div>

    <!-- Puxando o arquivo JS externo -->
    <script src="configuracoes.js"></script>
</body>
</html>
