<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Registro de Gastos</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
</head>
<body>

    <!-- Barra de Navegação -->
    <nav class="navbar">
        <!-- Casa no lado esquerdo -->
        <a href="index.html" class="link-casa" title="Voltar ao Início">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" width="32" height="32">
            <path d="M5 11 L12 5 L19 11 V19 A1 1 0 0 1 18 20 H6 A1 1 0 0 1 5 19 Z"/>
          </svg>
        </a>
        
        <!-- Botão Hambúrguer no lado direito com identificadores de animação -->
        <button id="btnMenu" class="btn-menu" aria-label="Abrir Menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" stroke-width="3" stroke-linecap="round">
                <line class="linha-topo" x1="3" y1="6" x2="21" y2="6"></line>
                <line class="linha-meio" x1="3" y1="12" x2="21" y2="12"></line>
                <line class="linha-baixo" x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        
       <!-- Menu suspenso -->
       <div id="menuDropdown" class="menu-dropdown">
            <a href="pagina2.html">Previsão de Gastos</a>
            <a href="pagina3.html">Controle</a>
            
            <!-- Separador Moderno -->
            <div class="menu-separador"></div>
            
            <a href="configuracoes.html">Configurações</a>
            <a href="#" id="btn-login-sync">Sincronizar com Google</a>
        </div>

    </nav>

    <div class="container">
        <h2>Configurações</h2>

        <div class="form-group">
            <label for="dinheiroInicial">Dinheiro Inicial (R$):</label>
            <p class="texto-dica">
                Adicione um valor base para a sua conta. Este valor será somado ao saldo total sem aparecer como um registro na tabela.
            </p>
            <input type="number" id="dinheiroInicial" step="0.01" placeholder="Ex: 200.00">
        </div>

        <!-- Botões Lado a Lado -->
        <div class="botoes-config-container">
            <button id="btnResetarConfig" class="btn-config-secundario">Resetar</button>
            
            <!-- O botão já começa com o atributo "disabled" (desativado) -->
            <button id="btnRegistrarConfig" class="btn-config" disabled>Salvar</button>
        </div>
    </div>

    <!-- Notificação Moderna (Toast) escondida -->
    <div id="toastNotificacao" class="toast-moderno">
        <span class="icone-check">✓</span> <span id="toastMensagem">Configurações salvas!</span>
    </div>

    <!-- Puxando o arquivo JS externo -->
    <script src="configuracoes.js"></script>
</body>
</html>
